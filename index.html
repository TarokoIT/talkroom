<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * wss://* ws://* https://* http://*;">
    
    <title>Supabase 語音廣播站 V5</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root { --main: #3ecf8e; --dark: #1c1c1c; }
        * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f0f0f0; overflow: hidden; }
        
        /* 登入介面 */
        #login-screen { position: fixed; inset: 0; background: var(--dark); color: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; color: #333; padding: 30px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* 頂部狀態列 */
        .header { background: var(--dark); color: white; padding: 10px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .user-list { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; min-height: 40px; }
        .u-tag { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--main); white-space: nowrap; }

        /* 聊天視窗 */
        #chat-win { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 12px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; border-bottom-left-radius: 2px; }
        .u-name { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; opacity: 0.8; }

        /* 底部控制列 */
        .footer { background: white; padding: 10px; border-top: 1px solid #ddd; padding-bottom: env(safe-area-inset-bottom); display: flex; flex-direction: column; gap: 10px; }
        
        .input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        /* 新增：將控制項包裝，緊貼在輸入框旁 */
        .inline-tools { display: flex; align-items: center; gap: 5px; background: #f8f9fa; padding: 5px 10px; border-radius: 20px; border: 1px solid #ddd; }
        .inline-tools input[type="color"] { border: none; padding: 0; width: 22px; height: 22px; cursor: pointer; background: transparent; border-radius: 50%; }
        .inline-tools input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .inline-tools input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; box-shadow: 0 0 2px rgba(0,0,0,0.3); }
        .inline-tools select { border: none; background: transparent; font-size: 13px; outline: none; cursor: pointer; color: #333; font-weight: bold; }

        .text-input-wrapper { display: flex; flex: 1; gap: 8px; min-width: 200px; }
        #msg-in { flex: 1; padding: 10px 15px; border-radius: 25px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        
        .btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; background: #eee; }
        #mic-btn.on { background: #ff4757; color: white; animation: pulse 1.5s infinite; }
        #spk-btn { background: #2f3542; color: white; }
        #send-btn { background: var(--main); color: white; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="margin-top:0">🎙️ 即時對講站</h2>
        <input type="text" id="user-in" placeholder="請輸入暱稱" style="width:100%; padding:12px; margin:20px 0; border:1px solid #ddd; border-radius:8px; text-align:center;">
        <button id="login-btn" onclick="initApp()" style="width:100%; padding:12px; background:var(--main); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;">登入並授權麥克風</button>
        <p id="log" style="font-size:12px; color:#888; margin-top:10px;"></p>
    </div>
</div>

<div class="header">
    <div style="font-size:11px; color:var(--main); margin-bottom:5px; font-weight:bold;">● 線上人員狀態：</div>
    <div id="user-list" class="user-list"></div>
</div>

<div id="chat-win"></div>

<div class="footer">
    <div class="input-row">
        <button id="spk-btn" class="btn" onclick="toggleSpk()">🔊</button>
        <button id="mic-btn" class="btn" onclick="toggleMic()">🎤</button>
        
        <div class="text-input-wrapper">
            <div class="inline-tools">
                <input type="color" id="c-name" value="#1e90ff" title="名字顏色">
                <input type="color" id="c-text" value="#2f3542" title="文字顏色">
                <select id="f-size" title="文字大小">
                    <option value="14px">小</option>
                    <option value="18px" selected>中</option>
                    <option value="24px">大</option>
                </select>
            </div>
            
            <input type="text" id="msg-in" placeholder="輸入訊息..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button id="send-btn" class="btn" onclick="sendMsg()">🚀</button>
        </div>
    </div>
</div>

<div id="audio-container" style="display:none"></div>

<script>
    // --- 填寫你的 Supabase 資訊 ---
    const SUPABASE_URL = "https://zfnzhrcuwfejytftptio.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmbnpocmN1d2Zlanl0ZnRwdGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTIyMDIsImV4cCI6MjA5Mzg2ODIwMn0.ZjMu3B_ODgYEos3ayUksxunkU5vhaxn62Ya_Z4-7xiY";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = "", myPeerId = "", peer = null, myStream = null;
    let isMic = false, isSpk = true;
    let audioCtx = null;
    let presenceChannel = null;

    async function initApp() {
        const btn = document.getElementById('login-btn');
        const log = document.getElementById('log');
        myName = document.getElementById('user-in').value.trim();
        
        if(!myName) return alert("請輸入名字");
        btn.disabled = true;
        log.innerText = "取得麥克風授權中...";

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            myStream.getAudioTracks()[0].enabled = false;
            
            log.innerText = "連接通訊伺服器中...";
            peer = new Peer();
            
            peer.on('open', (id) => {
                myPeerId = id;
                log.innerText = "連線成功！同步中...";
                setupRealtime();
                document.getElementById('login-screen').style.display = 'none';
            });

            peer.on('call', (call) => {
                call.answer(myStream);
                call.on('stream', (stream) => {
                    handleRemoteStream(call.peer, stream);
                });
            });

            peer.on('error', (e) => {
                log.innerText = "語音伺服器連線被阻擋：" + e.type;
                btn.disabled = false;
            });

        } catch (e) { 
            log.innerText = "錯誤: 找不到麥克風，或未處於 HTTPS 安全連線中。";
            btn.disabled = false;
        }
    }

    function setupRealtime() {
        client.channel('chat_room')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                renderMsg(payload.new);
                // 不是自己發的訊息，就發出「叮叮」聲
                if(payload.new.username !== myName) playDingDing();
            })
            .subscribe();

        presenceChannel = client.channel('online_users', { config: { presence: { key: myName } } });

        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                updateUserList(presenceChannel.presenceState());
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await presenceChannel.track({ peerId: myPeerId, mic: isMic, spk: isSpk, at: Date.now() });
                }
            });

        loadHistory();
    }

    async function sendMsg() {
        const input = document.getElementById('msg-in');
        const text = input.value.trim();
        if(!text) return;

        const { error } = await client.from('chat_messages').insert([{
            username: myName,
            message: text,
            name_color: document.getElementById('c-name').value,
            text_color: document.getElementById('c-text').value,
            font_size: document.getElementById('f-size').value
        }]);

        if(!error) input.value = "";
    }

    function renderMsg(data) {
        const win = document.getElementById('chat-win');
        if(document.getElementById('m-'+data.id)) return;

        const isMe = data.username === myName;
        const div = document.createElement('div');
        div.id = 'm-' + data.id;
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `
            <span class="u-name" style="color:${data.name_color}">${data.username}</span>
            <div style="color:${data.text_color}; font-size:${data.font_size}">${data.message}</div>
        `;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    async function loadHistory() {
        const { data } = await client.from('chat_messages').select('*').order('created_at', { ascending: true }).limit(30);
        if(data) data.forEach(renderMsg);
    }

    function toggleMic() {
        isMic = !isMic;
        myStream.getAudioTracks()[0].enabled = isMic;
        document.getElementById('mic-btn').className = isMic ? "btn on" : "btn";

        presenceChannel.track({ peerId: myPeerId, mic: isMic, spk: isSpk, at: Date.now() });

        if(isMic) {
            const state = presenceChannel.presenceState();
            Object.values(state).forEach(p => {
                p.forEach(u => {
                    if(u.peerId && u.peerId !== myPeerId) peer.call(u.peerId, myStream);
                });
            });
        }
    }

    function toggleSpk() {
        isSpk = !isSpk;
        document.getElementById('spk-btn').innerText = isSpk ? "🔊" : "🔇";
        document.querySelectorAll('#audio-container audio').forEach(a => a.muted = !isSpk);
        presenceChannel.track({ peerId: myPeerId, mic: isMic, spk: isSpk, at: Date.now() });
    }

    function handleRemoteStream(pId, stream) {
        let aud = document.getElementById('aud-' + pId);
        if(!aud) {
            aud = document.createElement('audio');
            aud.id = 'aud-' + pId;
            aud.autoplay = true;
            document.getElementById('audio-container').appendChild(aud);
        }
        aud.srcObject = stream;
        aud.muted = !isSpk;
    }

    function updateUserList(state) {
        const list = document.getElementById('user-list');
        list.innerHTML = "";
        Object.keys(state).forEach(name => {
            const u = state[name][0];
            const div = document.createElement('div');
            div.className = 'u-tag';
            div.innerHTML = `${name} ${u.mic ? '🎙️' : '🔇'} ${u.spk ? '🔊' : '🔈'}`;
            list.appendChild(div);
        });
    }

    // 播放「叮叮」兩聲的邏輯
    function playDingDing() {
        if(!audioCtx) return;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        function beep(timeOffset) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            // 頻率 1200 產生比較清脆的高音
            o.frequency.setValueAtTime(1200, audioCtx.currentTime + timeOffset);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime + timeOffset);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + timeOffset + 0.15);
            o.start(audioCtx.currentTime + timeOffset);
            o.stop(audioCtx.currentTime + timeOffset + 0.15);
        }
        
        beep(0);       // 第一聲叮
        beep(0.2);     // 間隔 0.2 秒後發出第二聲叮
    }
</script>
</body>
</html>
