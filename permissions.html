<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalkRoom｜管理員權限</title><link rel="stylesheet" href="styles.css?v=2.5.0"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script><script type="module" src="permissions.js?v=2.5.0"></script></head>
<body><main class="lobby"><header class="brand"><span>TalkRoom<small>管理員權限規劃</small></span><span class="version">後台 v2.5.0</span></header><p><a href="admin.html">← 返回後台</a> · <a href="records.html">記錄搜尋</a></p>
<section id="access-login" class="entry-panel"><h1>管理員登入</h1><form id="access-login-form"><label>Email<input id="access-email" type="email" autocomplete="username" required></label><label>密碼<input id="access-password" type="password" autocomplete="current-password" required></label><button class="primary">登入</button></form><p><a href="admin.html">忘記密碼：到後台寄送重設信</a></p></section>
<p id="access-status" role="status" aria-live="polite"></p><section id="access-panel" hidden><div class="record-actions"><button id="access-refresh" class="secondary">重新整理</button><button id="access-signout" class="secondary">登出</button></div>
<h1>管理員權限</h1><p>每個帳號可分別設定頁面與動作；權限適用所有房間。儲存後下一次操作即由伺服器採用新權限；介面請重新整理。帳號停用只撤銷後台權限，不影響房間登入。</p><p>「進入／搜尋」允許查看該頁資料；匯出權限控制系統提供的 CSV 功能。允許查看的人仍能複製畫面上的內容。授予「變更他人權限」代表對方也可以授予完整管理權。</p>
<div id="permission-list" class="admin-grid"></div><section id="new-access" class="entry-panel" hidden><h2>新增管理帳號授權</h2><p>新增授權不會建立登入密碼或寄信；對方仍須在後台首次建立帳號並驗證 Email。</p><form id="new-access-form"><label>Email<input id="new-access-email" type="email" maxlength="254" required></label><button class="primary">新增為紀錄查詢員（搜尋＋匯出）</button></form></section></section></main></body></html>
